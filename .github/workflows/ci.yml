name: NovaMart Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novamart_user
          POSTGRES_PASSWORD: novamart_password
          POSTGRES_DB: novamart_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff black

      - name: Run Code Format & Lint Checks
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: Run Pytest Test Suite with Coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://novamart_user:novamart_password@localhost:5432/novamart_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_ci_secret_key_12345
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  frontend-tests:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build
