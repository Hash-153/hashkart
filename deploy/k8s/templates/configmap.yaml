apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: novamart
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  APP_NAME: "NovaMart Enterprise Marketplace"
  APP_ENV: {{ .Values.backend.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.backend.env.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
  RATE_LIMIT_BURST: {{ .Values.backend.env.RATE_LIMIT_BURST | quote }}
  RATE_LIMIT_RATE: {{ .Values.backend.env.RATE_LIMIT_RATE | quote }}
  DATABASE_HOST: {{ .Values.database.host | quote }}
  DATABASE_PORT: {{ .Values.database.port | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  DATABASE_USER: {{ .Values.database.user | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: novamart
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: "prod-enterprise-sec-k8s-supersecret-novamart-2026-key"
  DATABASE_PASSWORD: "AuroraProdSecurePassword2026!#"
  DATABASE_URL: "postgresql+asyncpg://novamart_app:AuroraProdSecurePassword2026!#@{{ .Values.database.host }}:5432/{{ .Values.database.name }}"
  REDIS_URL: "redis://{{ .Values.redis.host }}:6379/0"
  RAZORPAY_KEY_ID: "rzp_live_novamart_sec_99182"
  RAZORPAY_KEY_SECRET: "rzp_sec_live_99a8b7c6d5e4f3a2"
  WEBHOOK_HMAC_SECRET: "hmac_live_signing_secret_998124912"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sa
  labels:
    app.kubernetes.io/name: novamart
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::602401143452:role/novamart-backend-irsa
