upstream backend_api {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream frontend_app {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name novamart.in www.novamart.in seller.novamart.in admin.novamart.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name novamart.in www.novamart.in seller.novamart.in admin.novamart.in;

    include /etc/nginx/conf.d/ssl_params.conf;
    include /etc/nginx/conf.d/security_headers.conf;

    client_max_body_size 25M;

    # API Proxy
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Prometheus Metrics (Internal Only)
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend_api/metrics;
    }

    # Frontend Single Page App Proxy
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
